<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AlumniConnect</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>
    <!-- Background Decoration Blobs -->
    <div class="bg-blob" id="blob-1"></div>
    <div class="bg-blob" id="blob-2"></div>
    <div class="bg-blob" id="blob-3"></div>

    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-mortarboard-fill"></i> AlumniConnect
                </a>
                <div class="ms-auto">
                    <a href="register.html" class="btn btn-primary">Sign Up</a>
                </div>
            </div>
        </nav>

        <div class="auth-card mx-auto">
            <div class="auth-sidebar d-none d-md-flex">
                <h2>Welcome Back</h2>
                <p>Log in to discover new opportunities and reconnect with your peers.</p>
                <div class="mt-4 p-4 card glass-bg-strong border-0">
                    <i class="bi bi-quote fs-1 opacity-25"></i>
                    <p class="fst-italic opacity-75">Your network is your net worth.</p>
                </div>
            </div>
            
            <div class="auth-form-container">
                <div class="text-center mb-4 d-md-none">
                    <h3 class="fw-bold text-primary">Welcome Back</h3>
                </div>
                
                <div class="d-flex justify-content-center mb-4">
                    <ul class="nav nav-pills" id="loginTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="password-tab" data-bs-toggle="pill" data-bs-target="#password-login" type="button">Password</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="otp-tab" data-bs-toggle="pill" data-bs-target="#otp-login" type="button">Email</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="mobile-tab" data-bs-toggle="pill" data-bs-target="#mobile-login" type="button">Mobile</button>
                        </li>
                    </ul>
                </div>
                
                <div class="tab-content" id="loginTabContent">
                    <!-- Password Login -->
                    <div class="tab-pane fade show active" id="password-login" role="tabpanel">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>
                            <button type="submit" id="loginBtn" class="btn btn-primary w-100 mb-4">Log In</button>
                        </form>
                    </div>

                    <!-- OTP Login -->
                    <div class="tab-pane fade" id="otp-login" role="tabpanel">
                        <form id="otpSendForm">
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="otpEmail" placeholder="name@example.com" required>
                            </div>
                            <button type="submit" id="sendOtpBtn" class="btn btn-primary w-100 mb-4">Send Verification Code</button>
                        </form>

                        <form id="otpVerifyForm" class="d-none">
                            <div class="badge-custom w-100 mb-3 justify-content-center">Code sent to your email</div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">6-Digit Code</label>
                                <input type="text" class="form-control text-center" id="otpCode" placeholder="000000" required pattern="[0-9]{6}" maxlength="6">
                            </div>
                            <button type="submit" id="verifyOtpBtn" class="btn btn-secondary w-100 mb-4">Verify & Log In</button>
                            <div class="text-center">
                                <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="location.reload()">Change Email</button>
                            </div>
                        </form>
                    </div>

                    <!-- Mobile OTP Login -->
                    <div class="tab-pane fade" id="mobile-login" role="tabpanel">
                        <form id="mobileSendForm">
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Mobile Number</label>
                                <input type="tel" class="form-control" id="mobilePhone" placeholder="+91 0000000000" required>
                            </div>
                            <button type="submit" id="sendMobileBtn" class="btn btn-primary w-100 mb-4">Send Code</button>
                        </form>

                        <form id="mobileVerifyForm" class="d-none">
                            <div class="badge-custom w-100 mb-3 justify-content-center">Code sent to your mobile</div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">6-Digit Code</label>
                                <input type="text" class="form-control text-center" id="mobileCode" placeholder="000000" required pattern="[0-9]{6}" maxlength="6">
                            </div>
                            <button type="submit" id="verifyMobileBtn" class="btn btn-secondary w-100 mb-4">Verify & Log In</button>
                            <div class="text-center">
                                <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="location.reload()">Change Number</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <p class="text-center opacity-75 mt-3">
                    Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
