<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Board - AlumniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/pages.css" rel="stylesheet">
</head>
<body>
    <!-- Background Decoration Blobs -->
    <div class="bg-blob" id="blob-1"></div>
    <div class="bg-blob" id="blob-2"></div>
    <div class="bg-blob" id="blob-3"></div>

    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-mortarboard-fill"></i> AlumniConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="alumni-directory.html">Directory</a></li>
                        <li class="nav-item"><a class="nav-link active" href="jobs.html">Jobs</a></li>
                        <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                        <li class="nav-item"><a class="nav-link" href="community.html">Community</a></li>
                    </ul>
                    <div id="navAuthSpans">
                        <a href="login.html" class="btn btn-outline-primary">Log In</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="page-header">
            <h1 class="display-3">Job Board</h1>
            <p class="lead">Explore exclusive job opportunities and internships posted by our alumni network.</p>
            <div class="mt-4" id="postJobBtnContainer" style="display: none;">
                <a href="post-job.html" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Post a Job</a>
            </div>
        </div>

        <div class="container mb-5">
            <div class="row g-4">
                <!-- Sidebar Filters -->
                <div class="col-lg-3">
                    <div class="filter-sidebar">
                        <h5>Filters</h5>
                        <form id="jobFilterForm">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Search Keywords</label>
                                <input type="text" id="jobSearch" class="form-control" placeholder="e.g. Developer">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Job Type</label>
                                <select id="jobType" class="form-select">
                                    <option value="">All Types</option>
                                    <option value="job">Full-time Job</option>
                                    <option value="internship">Internship</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Location</label>
                                <input type="text" id="jobLocation" class="form-control" placeholder="e.g. Remote, Mumbai">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Find Jobs</button>
                        </form>
                    </div>
                </div>

                <!-- Job List -->
                <div class="col-lg-9">
                    <div id="jobsContainer">
                        <div class="text-center py-5 w-100"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentQuery = '';
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('user');
            if(userStr) {
                const user = JSON.parse(userStr);
                if(user.role === 'alumni' || user.role === 'admin') {
                    document.getElementById('postJobBtnContainer').style.display = 'block';
                }
            }

            if (window.socket) {
                window.socket.on('job_created', () => fetchJobs(currentQuery));
            }

            fetchJobs();

            document.getElementById('jobFilterForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const s = document.getElementById('jobSearch').value;
                const t = document.getElementById('jobType').value;
                const l = document.getElementById('jobLocation').value;
                currentQuery = "?search=" + s + "&type=" + t + "&location=" + l;
                fetchJobs(currentQuery);
            });
        });

        async function fetchJobs(query = '') {
            const container = document.getElementById('jobsContainer');
            container.innerHTML = '<div class="text-center py-5 w-100"><div class="spinner-border text-primary"></div></div>';
            
            try {
                const jobs = await api.jobs.getAll(query);
                if (jobs.length === 0) {
                    container.innerHTML = `<div class="card p-4 text-center"><i class="bi bi-info-circle fs-2 mb-3 text-primary"></i> <p class="mb-0">No jobs found matching your criteria.</p></div>`;
                    return;
                }

                let html = '';
                jobs.forEach(job => {
                    const icon = job.type === 'job' ? 'bi-briefcase-fill' : 'bi-mortarboard-fill';
                    const deadlineText = job.deadline ? `Deadline: ${new Date(job.deadline).toLocaleDateString()}` : 'No deadline';
                    const userImg = job.postedBy && job.postedBy.profileImage ? `http://localhost:5000${job.postedBy.profileImage}` : `https://ui-avatars.com/api/?name=${job.company}&background=random`;
                    
                    let skillsHtml = '';
                    if(job.requiredSkills && job.requiredSkills.length > 0) {
                        skillsHtml = '<div class="mt-3 d-flex gap-2 flex-wrap">' + job.requiredSkills.map(s => `<span class="skill-tag">${s}</span>`).join('') + '</div>';
                    }

                    let applyButtonHtml = '';
                    if (job.applyLink) {
                        applyButtonHtml = `<a href="${job.applyLink}" target="_blank" class="btn btn-primary px-4 btn-sm">Apply Now <i class="bi bi-box-arrow-up-right small ms-1"></i></a>`;
                    } else if (job.applyEmail) {
                        applyButtonHtml = `<a href="mailto:${job.applyEmail}?subject=Application for ${job.title}" class="btn btn-primary px-4 btn-sm">Email Application <i class="bi bi-envelope small ms-1"></i></a>`;
                    }

                    html += `
                    <div class="item-card mb-4">
                        <div class="d-flex align-items-center mb-4">
                            <img src="${userImg}" alt="${job.company}" class="rounded-4 border" style="width: 80px; height: 80px; object-fit: cover; border: 4px solid var(--glass-border) !important;">
                            <div class="ms-4 flex-grow-1">
                                <h4 class="fw-bold mb-1"><a href="job-details.html?id=${job._id}" class="text-dark text-decoration-none">${job.title}</a></h4>
                                <div class="d-flex align-items-center gap-3 flex-wrap">
                                    <span class="text-muted"><i class="bi bi-building me-1"></i> ${job.company}</span>
                                    <span class="text-muted"><i class="bi bi-geo-alt-fill me-1"></i> ${job.location}</span>
                                </div>
                            </div>
                            <div class="text-end d-none d-md-block">
                                <h5 class="text-primary fw-bold mb-0">${job.salaryOrStipend || 'Not disclosed'}</h5>
                                <p class="text-muted small mb-0">${deadlineText}</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <span class="badge-custom"><i class="${icon} me-2"></i> ${job.type.toUpperCase()}</span>
                            <span class="badge-custom d-md-none">${job.salaryOrStipend || 'Competitive'}</span>
                        </div>
                        <p class="mb-0 opacity-75">${job.description ? job.description.substring(0, 160) + '...' : ''}</p>
                        ${skillsHtml}
                        <div class="mt-4 pt-3 border-top border-light d-flex justify-content-between align-items-center">
                            <span class="small opacity-50"><i class="bi bi-calendar3 me-1"></i> Posted ${new Date(job.createdAt || Date.now()).toLocaleDateString()}</span>
                            ${applyButtonHtml}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="card p-4 text-center text-danger"><i class="bi bi-exclamation-triangle fs-2 mb-2"></i> <p>Failed to load jobs. Please check your connection.</p></div>`;
            }
        }
    </script>
</body>
</html>
