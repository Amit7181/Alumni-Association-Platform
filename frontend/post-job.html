<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - AlumniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/pages.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill"></i> AlumniConnect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="alumni-directory.html">Directory</a></li>
                    <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="community.html">Community</a></li>
                </ul>
                <div id="navAuthSpans">
                    <a href="login.html" class="btn btn-outline-primary">Log In</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; margin-bottom: 60px;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white p-4 border-bottom pb-3">
                        <h3 class="fw-bold mb-0 text-primary"><i class="bi bi-briefcase-fill me-2"></i>Post an Opportunity</h3>
                        <p class="text-muted mb-0 small mt-1">Help students and fellow alumni grow by sharing jobs and internships.</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <div id="alertBox" class="alert d-none" role="alert"></div>

                        <form id="postJobForm">
                            <div class="row g-3 mb-4">
                                <div class="col-md-8">
                                    <label class="form-label fw-bold">Job Title *</label>
                                    <input type="text" class="form-control" id="title" required placeholder="e.g. Frontend Developer">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Type *</label>
                                    <select class="form-select" id="type" required>
                                        <option value="job">Full-time Job</option>
                                        <option value="internship">Internship</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Company Name *</label>
                                    <input type="text" class="form-control" id="company" required placeholder="e.g. Google">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Location *</label>
                                    <input type="text" class="form-control" id="location" required placeholder="e.g. Remote, San Francisco">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Job Description *</label>
                                <textarea class="form-control" id="description" rows="5" required placeholder="Describe the role, responsibilities, and requirements..."></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Required Skills</label>
                                <input type="text" class="form-control" id="requiredSkills" placeholder="React, Node.js, Python (comma separated)">
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Salary / Stipend</label>
                                    <input type="text" class="form-control" id="salaryOrStipend" placeholder="e.g. $80k - $100k or ₹20,000/month">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Application Deadline</label>
                                    <input type="date" class="form-control" id="deadline">
                                </div>
                            </div>

                            <hr class="my-4">
                            <h5 class="fw-bold mb-3">How should candidates apply?</h5>
                            <p class="text-muted small mb-3">Provide at least an external link or an email address where candidates can send their resumes.</p>
                            
                            <div class="row g-3 mb-5">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Application Link</label>
                                    <input type="url" class="form-control" id="applyLink" placeholder="https://careers.google.com/xyz">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Application Email</label>
                                    <input type="email" class="form-control" id="applyEmail" placeholder="hr@company.com">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-3">
                                <a href="alumni-dashboard.html" class="btn btn-light px-4">Cancel</a>
                                <button type="submit" id="submitBtn" class="btn btn-primary px-5 py-2 fw-bold">Post Job</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            api.checkAuth();
            const userStr = localStorage.getItem('user');
            if(userStr) {
                const user = JSON.parse(userStr);
                if(user.role === 'student') {
                    alert('Students cannot post jobs.');
                    window.location.href = 'student-dashboard.html';
                }
            }

            document.getElementById('postJobForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const alertBox = document.getElementById('alertBox');
                
                try {
                    btn.disabled = true;
                    btn.innerText = 'Posting...';

                    const skillsVal = document.getElementById('requiredSkills').value;
                    const skillsArray = skillsVal ? skillsVal.split(',').map(s=>s.trim()) : [];

                    const data = {
                        title: document.getElementById('title').value,
                        type: document.getElementById('type').value,
                        company: document.getElementById('company').value,
                        location: document.getElementById('location').value,
                        description: document.getElementById('description').value,
                        requiredSkills: skillsArray,
                        salaryOrStipend: document.getElementById('salaryOrStipend').value,
                        deadline: document.getElementById('deadline').value,
                        applyLink: document.getElementById('applyLink').value,
                        applyEmail: document.getElementById('applyEmail').value
                    };

                    await api.jobs.create(data);
                    
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = 'Job posted successfully!';
                    
                    setTimeout(() => {
                        window.location.href = 'jobs.html';
                    }, 1500);

                } catch (error) {
                    alertBox.className = 'alert alert-danger';
                    alertBox.innerText = error.message;
                    alertBox.classList.remove('d-none');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Post Job';
                }
            });
        });
    </script>
</body>
</html>
