<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - AlumniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Background Decoration Blobs -->
    <div class="bg-blob" id="blob-1"></div>
    <div class="bg-blob" id="blob-2"></div>
    <div class="bg-blob" id="blob-3"></div>

    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill"></i> AlumniConnect</a>
                <div class="ms-auto"><a href="index.html" class="btn btn-outline-primary">Return to Dashboard</a></div>
            </div>
        </nav>

        <div class="container py-5 mt-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-lg border-0">
                        <div class="card-header border-0 bg-transparent p-4 pb-0">
                            <h3 class="fw-bold mb-1 text-primary"><i class="bi bi-person-gear me-3"></i>Account Preferences</h3>
                            <p class="opacity-75 small">Manage your professional identity and privacy settings.</p>
                        </div>
                        <div class="card-body p-4 p-md-5 pt-0">
                            <div id="alertBox" class="badge-custom w-100 p-3 mb-4 d-none" role="alert"></div>

                            <form id="settingsForm">
                                
                                <!-- Profile Picture -->
                                <div class="d-flex align-items-center mb-5 pb-5 border-bottom border-light border-opacity-10">
                                    <div class="position-relative">
                                        <img id="profilePreview" src="https://ui-avatars.com/api/?name=User&background=random" class="rounded-circle border" style="width: 120px; height: 120px; object-fit: cover; border: 4px solid var(--glass-border) !important;">
                                        <div class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle p-2 shadow-sm" style="cursor: pointer;" onclick="document.getElementById('profileImage').click()">
                                            <i class="bi bi-camera-fill"></i>
                                        </div>
                                    </div>
                                    <div class="ms-4">
                                        <h6 class="fw-bold mb-1">Avatar Graphics</h6>
                                        <input class="form-control form-control-sm mb-2" type="file" id="profileImage" accept="image/*">
                                        <small class="opacity-50">Recommended: Square WEBP, max 2MB</small>
                                    </div>
                                </div>

                                <h5 class="fw-bold mb-4 text-primary">Core Metadata</h5>
                                <div class="row g-4 mb-5">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Identification Name</label>
                                        <input type="text" class="form-control" id="name" required placeholder="Display Name">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Mobile Connection</label>
                                        <input type="text" class="form-control" id="phone" placeholder="+1 234 567 890">
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label small fw-bold">Living Location</label>
                                        <input type="text" class="form-control" id="location" placeholder="City, Country">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">Professional Biography</label>
                                        <textarea class="form-control" id="bio" rows="4" placeholder="Briefly describe your career journey..."></textarea>
                                    </div>
                                </div>

                                <div id="alumniSettings" class="d-none">
                                    <h5 class="fw-bold mb-4 text-primary">Industry Credentials</h5>
                                    <div class="row g-4 mb-5">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold">Current Organization</label>
                                            <input type="text" class="form-control" id="currentCompany" placeholder="Employer Name">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold">Technical Designation</label>
                                            <input type="text" class="form-control" id="jobRole" placeholder="e.g. Lead Engineer">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small fw-bold">Expertise Tags</label>
                                            <input type="text" class="form-control" id="skills" placeholder="React, Node.js, System Design">
                                        </div>
                                        <div class="col-12">
                                            <div class="form-check form-switch p-4 bg-primary bg-opacity-10 rounded-pill border border-primary border-opacity-10 d-flex align-items-center justify-content-between">
                                                <label class="form-check-label fw-bold mb-0 ps-3" for="mentorshipAvailable">Available for Professional Mentoring</label>
                                                <input class="form-check-input ms-0 me-3" type="checkbox" id="mentorshipAvailable" style="width: 3rem; height: 1.5rem;">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <h5 class="fw-bold mb-4 text-primary">Global Presence</h5>
                                <div class="row g-4 mb-5">
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <span class="input-group-text border-0 bg-transparent"><i class="bi bi-linkedin fs-5"></i></span>
                                            <input type="url" class="form-control ps-0 h-auto py-3" id="linkedinUrl" placeholder="linkedin.com/in/username">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <span class="input-group-text border-0 bg-transparent"><i class="bi bi-github fs-5"></i></span>
                                            <input type="url" class="form-control ps-0 h-auto py-3" id="githubUrl" placeholder="github.com/username">
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end pt-4 border-top border-light border-opacity-10">
                                    <button type="submit" id="saveBtn" class="btn btn-primary px-5 py-3 fw-bold rounded-pill">Synchronize Changes</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            api.checkAuth();
            const alertBox = document.getElementById('alertBox');
            let currentUser = null;

            try {
                const profile = await api.users.getProfile();
                currentUser = profile;

                document.getElementById('name').value = profile.name || '';
                document.getElementById('phone').value = profile.phone || '';
                document.getElementById('location').value = profile.location || '';
                document.getElementById('bio').value = profile.bio || '';
                document.getElementById('linkedinUrl').value = profile.linkedinUrl || '';
                document.getElementById('githubUrl').value = profile.githubUrl || '';

                if (profile.profileImage) {
                    document.getElementById('profilePreview').src = `http://localhost:5000${profile.profileImage}`;
                }

                if (profile.role === 'alumni') {
                    document.getElementById('alumniSettings').classList.remove('d-none');
                    document.getElementById('currentCompany').value = profile.currentCompany || '';
                    document.getElementById('jobRole').value = profile.jobRole || '';
                    document.getElementById('skills').value = (profile.skills || []).join(', ');
                    document.getElementById('mentorshipAvailable').checked = profile.mentorshipAvailable;
                }
            } catch(e) {
                showToast("Identity sync failed", 'error');
            }

            document.getElementById('settingsForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('saveBtn');
                
                try {
                    btn.disabled = true;
                    btn.innerText = 'Synchronizing...';

                    const formData = new FormData();
                    formData.append('name', document.getElementById('name').value);
                    formData.append('phone', document.getElementById('phone').value);
                    formData.append('location', document.getElementById('location').value);
                    formData.append('bio', document.getElementById('bio').value);
                    formData.append('linkedinUrl', document.getElementById('linkedinUrl').value);
                    formData.append('githubUrl', document.getElementById('githubUrl').value);

                    if (currentUser && currentUser.role === 'alumni') {
                        formData.append('currentCompany', document.getElementById('currentCompany').value);
                        formData.append('jobRole', document.getElementById('jobRole').value);
                        formData.append('skills', document.getElementById('skills').value);
                        formData.append('mentorshipAvailable', document.getElementById('mentorshipAvailable').checked);
                    }

                    const fileInput = document.getElementById('profileImage');
                    if (fileInput.files[0]) {
                        formData.append('profileImage', fileInput.files[0]);
                    }

                    await api.users.updateProfile(formData);
                    
                    showToast('Profile credentials updated', 'success');
                    
                    const localUser = JSON.parse(localStorage.getItem('user'));
                    localUser.name = document.getElementById('name').value;
                    localStorage.setItem('user', JSON.stringify(localUser));

                } catch (error) {
                    showToast(error.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Synchronize Changes';
                }
            });
        });
    </script>
</body>
</html>
