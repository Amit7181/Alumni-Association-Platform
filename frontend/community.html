<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - AlumniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/pages.css" rel="stylesheet">
</head>
<body>
    <!-- Background Decoration Blobs -->
    <div class="bg-blob" id="blob-1"></div>
    <div class="bg-blob" id="blob-2"></div>
    <div class="bg-blob" id="blob-3"></div>

    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid px-4">
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-mortarboard-fill"></i> AlumniConnect
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="alumni-directory.html">Directory</a></li>
                        <li class="nav-item"><a class="nav-link" href="jobs.html">Jobs</a></li>
                        <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                        <li class="nav-item"><a class="nav-link active" href="community.html">Community</a></li>
                    </ul>
                    <div id="navAuthSpans">
                        <a href="login.html" class="btn btn-outline-primary">Log In</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container-fluid px-lg-5 py-4">
            <div class="row g-4">
                
                <!-- Left Sidebar -->
                <div class="col-lg-3 d-none d-lg-block">
                    <div class="card mb-4" id="profileShortCard" style="display:none;">
                        <div class="card-body text-center p-4">
                            <img id="myAvatar" src="" class="rounded-circle mb-3 border border-3 border-light shadow-sm" width="100" height="100" style="border: 4px solid var(--glass-border) !important;">
                            <h5 class="fw-bold mb-1" id="myName">Name</h5>
                            <p class="opacity-75 small mb-3" id="myRole">Role</p>
                            <a href="profile-settings.html" class="btn btn-primary btn-sm w-100">Update Profile</a>
                        </div>
                    </div>
                    
                    <div class="card border-0">
                        <div class="card-header border-0 bg-transparent py-3"><h6 class="fw-bold mb-0">Trending Topics</h6></div>
                        <div class="list-group list-group-flush bg-transparent">
                            <a href="#" class="list-group-item list-group-item-action bg-transparent py-3 border-light border-opacity-10"><i class="bi bi-hash text-primary me-2"></i>Success Stories</a>
                            <a href="#" class="list-group-item list-group-item-action bg-transparent py-3 border-light border-opacity-10"><i class="bi bi-hash text-primary me-2"></i>Job Referrals</a>
                            <a href="#" class="list-group-item list-group-item-action bg-transparent py-3 border-light border-opacity-10"><i class="bi bi-hash text-primary me-2"></i>Tech Discussions</a>
                            <a href="#" class="list-group-item list-group-item-action bg-transparent py-3 border-0"><i class="bi bi-hash text-primary me-2"></i>Memories</a>
                        </div>
                    </div>
                </div>

                <!-- Feed Column -->
                <div class="col-lg-6">
                    <!-- Post Composer -->
                    <div class="card mb-5" id="composerCard" style="display: none;">
                        <div class="card-body p-4">
                            <form id="postForm">
                                <div class="d-flex mb-4">
                                    <img id="composerAvatar" src="" class="rounded-circle me-4 border" width="60" height="60" style="border: 2px solid var(--glass-border) !important;">
                                    <textarea class="form-control border-light" id="postContent" rows="3" placeholder="Share a success story or job referral..." required></textarea>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="d-flex gap-3 align-items-center">
                                        <input type="file" id="postImage" accept="image/*" class="d-none">
                                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('postImage').click()"><i class="bi bi-image me-1"></i> Add Photo</button>
                                        
                                        <select class="form-select form-select-sm w-auto border-light" id="postType">
                                            <option value="general">Discussion</option>
                                            <option value="success_story">Success Story</option>
                                            <option value="job_update">Job Referral</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary px-5 fw-bold" id="postBtn">Post Feed</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Posts Feed -->
                    <div id="postsFeedContainer" class="d-flex flex-column gap-4">
                        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>

                <!-- Right Sidebar -->
                <div class="col-lg-3 d-none d-lg-block">
                    <div class="card h-100">
                        <div class="card-header border-0 bg-transparent py-4"><h6 class="mb-0 fw-bold"><i class="bi bi-calendar-event text-warning me-2"></i>Event Calendar</h6></div>
                        <div class="card-body pt-0" id="sideEventsContainer">
                            <p class="opacity-50 small text-center py-4">Syncing events...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentUserGlobal = null;
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('user');
            let currentUser = null;
            if(userStr) {
                currentUser = JSON.parse(userStr);
                document.getElementById('profileShortCard').style.display = 'block';
                document.getElementById('composerCard').style.display = 'block';
                
                const av = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.name)}&background=random`;
                document.getElementById('myAvatar').src = av;
                document.getElementById('composerAvatar').src = av;
                document.getElementById('myName').innerText = currentUser.name;
                document.getElementById('myRole').innerText = (currentUser.role || 'Member').toUpperCase();
            }
            currentUserGlobal = currentUser;

            if (window.socket) {
                window.socket.on('post_created', () => fetchPosts(currentUserGlobal));
                window.socket.on('post_updated', () => fetchPosts(currentUserGlobal));
                window.socket.on('event_created', () => fetchSideEvents());
            }

            fetchPosts(currentUser);
            fetchSideEvents();

            const postForm = document.getElementById('postForm');
            if(postForm) {
                postForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('postBtn');
                    try {
                        btn.disabled = true;
                        btn.innerText = 'Sharing...';

                        const formData = new FormData();
                        formData.append('content', document.getElementById('postContent').value);
                        formData.append('type', document.getElementById('postType').value);
                        
                        const fileInput = document.getElementById('postImage');
                        if (fileInput.files[0]) {
                            formData.append('image', fileInput.files[0]);
                        }

                        await api.posts.create(formData);
                        document.getElementById('postContent').value = '';
                        if(fileInput) fileInput.value = '';
                        fetchPosts(currentUser);

                    } catch(err) {
                        alert(err.message);
                    } finally {
                        btn.disabled = false;
                        btn.innerText = 'Post Feed';
                    }
                });
            }
        });

        async function fetchPosts(currentUser) {
            const container = document.getElementById('postsFeedContainer');
            try {
                const posts = await api.posts.getAll();
                if(posts.length === 0) {
                    container.innerHTML = `<div class="card p-5 text-center opacity-50">Be the first to share something with the community!</div>`;
                    return;
                }

                let html = '';
                posts.forEach(post => {
                    const authorImg = post.author.profileImage ? `http://localhost:5000${post.author.profileImage}` : `https://ui-avatars.com/api/?name=${encodeURIComponent(post.author.name)}&background=random`;
                    const hasLiked = currentUser && post.likes.includes(currentUser.id);
                    
                    let badgeLabel = 'Update';
                    if (post.type === 'success_story') badgeLabel = 'Success Story';
                    else if (post.type === 'job_update') badgeLabel = 'Job Alert';
                    else if (post.type === 'announcement') badgeLabel = 'Announcement';

                    let imgHtml = '';
                    if (post.image) {
                        imgHtml = `<img src="http://localhost:5000${post.image}" class="img-fluid rounded-4 mt-4 w-100 shadow-sm border border-light border-opacity-10" style="max-height: 450px; object-fit: cover;">`;
                    }

                    html += `
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-4">
                                <div class="d-flex align-items-center">
                                    <img src="${authorImg}" class="rounded-circle me-3 border" width="55" height="55" style="border: 2px solid var(--glass-border) !important;">
                                    <div>
                                        <h6 class="fw-bold mb-1">
                                            <a href="alumni-profile.html?id=${post.author._id}" class="text-primary text-decoration-none">${post.author.name}</a>
                                        </h6>
                                        <small class="opacity-75">${post.author.role} • ${new Date(post.createdAt).toLocaleDateString()}</small>
                                    </div>
                                </div>
                                <span class="badge-custom">${badgeLabel.toUpperCase()}</span>
                            </div>
                            <p class="mb-0 fs-6 lh-base" style="white-space: pre-wrap;">${post.content}</p>
                            ${imgHtml}
                        </div>
                        <div class="card-footer bg-transparent border-0 d-flex p-4 pt-0 gap-3">
                            <button class="btn ${hasLiked ? 'btn-primary' : 'btn-outline-primary'} btn-sm px-4 fw-bold" onclick="likePost('${post._id}')">
                                <i class="bi ${hasLiked ? 'bi-heart-fill' : 'bi-heart'} me-2"></i> ${post.likes.length}
                            </button>
                            <button class="btn btn-outline-primary btn-sm px-4 fw-bold">
                                <i class="bi bi-chat-text me-2"></i> ${post.comments.length}
                            </button>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<div class="badge-custom bg-danger bg-opacity-10 text-danger w-100 p-4 justify-content-center">Session expired. Please log in again.</div>`;
            }
        }

        async function fetchSideEvents() {
            try {
                const events = await api.events.getAll();
                const container = document.getElementById('sideEventsContainer');
                if(events.length === 0) {
                    container.innerHTML = '<p class="opacity-50 small text-center py-4">No events scheduled.</p>';
                    return;
                }
                
                let html = '';
                events.slice(0,3).forEach(ev => {
                    html += `
                    <div class="mb-4 pb-3 border-bottom border-light border-opacity-10 last-child-no-border">
                        <h6 class="mb-1 fw-bold"><a href="event-details.html?id=${ev._id}" class="text-primary text-decoration-none">${ev.title}</a></h6>
                        <div class="d-flex gap-2">
                             <small class="opacity-75"><i class="bi bi-calendar3 me-1"></i>${new Date(ev.date).toLocaleDateString()}</small>
                             <small class="opacity-50">|</small>
                             <small class="opacity-75"><i class="bi bi-clock me-1"></i>${ev.time || '10:00 AM'}</small>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch(e) {}
        }

        window.likePost = async function(id) {
            try {
                await api.posts.like(id);
                const userStr = localStorage.getItem('user');
                const currentUser = userStr ? JSON.parse(userStr) : null;
                fetchPosts(currentUser);
            } catch(e) {
                alert("Please log in to like posts.");
            }
        }
    </script>
</body>
</html>
