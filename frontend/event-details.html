<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - AlumniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/pages.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill"></i> AlumniConnect</a>
            <div id="navAuthSpans" class="ms-auto"><a href="login.html" class="btn btn-outline-primary">Log In</a></div>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; margin-bottom: 60px;">
        <div class="mb-4">
            <a href="events.html" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Back to Events</a>
        </div>

        <div class="card shadow-sm border-0 mb-4 overflow-hidden rounded-4">
            <img id="eventBanner" src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Banner" class="w-100" style="height: 350px; object-fit: cover;">
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="d-flex align-items-center mb-2">
                    <span class="badge bg-primary bg-opacity-10 text-primary border border-primary me-2" id="eventCategory">Category</span>
                </div>
                <h1 class="fw-bold mb-3 display-5" id="eventTitle">Loading...</h1>
                
                <div class="d-flex flex-wrap gap-4 mb-4 pb-4 border-bottom">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-3 rounded text-primary fs-3 me-3"><i class="bi bi-calendar-check"></i></div>
                        <div>
                            <small class="text-muted d-block fw-semibold">Date</small>
                            <span class="fw-bold" id="eventDate">-</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <div class="bg-warning bg-opacity-10 p-3 rounded text-warning fs-3 me-3"><i class="bi bi-clock"></i></div>
                        <div>
                            <small class="text-muted d-block fw-semibold">Time</small>
                            <span class="fw-bold" id="eventTime">-</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <div class="bg-success bg-opacity-10 p-3 rounded text-success fs-3 me-3"><i class="bi bi-geo-alt"></i></div>
                        <div>
                            <small class="text-muted d-block fw-semibold">Venue</small>
                            <span class="fw-bold" id="eventVenue">-</span>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4 p-md-5">
                        <h4 class="fw-bold mb-3">About this Event</h4>
                        <div class="text-muted fs-6 lh-lg" id="eventDescription">Loading details...</div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4 bg-primary bg-opacity-10 border border-primary border-opacity-25" id="registerCard">
                    <div class="card-body p-4 text-center">
                        <h5 class="fw-bold mb-3">Join the Event</h5>
                        <p class="text-muted small mb-4">Secure your spot by registering now.</p>
                        <div id="registerAlert" class="alert d-none mb-3 small py-2"></div>
                        <button id="registerBtn" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm">RSVP Now</button>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3 border-bottom pb-2 text-dark"><i class="bi bi-mic text-danger me-2"></i>Speaker / Host</h5>
                        <div class="d-flex align-items-center mt-3">
                            <div class="bg-light p-3 rounded-circle text-muted fs-4 me-3"><i class="bi bi-person-fill"></i></div>
                            <div>
                                <h6 class="fw-bold mb-0 fs-5" id="eventSpeaker">TBD</h6>
                                <p class="text-muted small mb-0 mt-1">Host Organizer</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3 border-bottom pb-2">Attendees (<span id="attendeeCount">0</span>)</h5>
                        <div class="d-flex flex-wrap gap-2 mt-3" id="attendeesList">
                            <!-- Small avatars -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentUser = null;
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if(!eventId) return;

            const userStr = localStorage.getItem('user');
            if(userStr) currentUser = JSON.parse(userStr);

            // Universal socket listener for details page sync
            if (window.socket) {
                window.socket.on('event_updated', (data) => {
                    if (data.eventId === eventId) {
                        loadEventData(eventId);
                    }
                });
            }

            await loadEventData(eventId);

            // Register logic
            const registerBtn = document.getElementById('registerBtn');
            if (registerBtn) {
                registerBtn.addEventListener('click', () => {
                    const user = JSON.parse(localStorage.getItem('user'));
                    if (!user) {
                        alert('Please login to register.');
                        window.location.href = 'login.html';
                        return;
                    }

                    // Populate and show modal
                    document.getElementById('regEventId').value = eventId;
                    document.getElementById('regFullName').value = user.name || '';
                    document.getElementById('regNumber').value = user.rollNumber || '';
                    document.getElementById('regMobile').value = user.phone || '';
                    
                    const modal = new bootstrap.Modal(document.getElementById('eventRegistrationModal'));
                    modal.show();
                });
            }

            // Modal Form Submission
            const regForm = document.getElementById('eventRegistrationForm');
            if (regForm) {
                regForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('regSubmitBtn');
                    const alertBox = document.getElementById('regAlert');
                    
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Registering...';

                    try {
                        const data = {
                            fullName: document.getElementById('regFullName').value,
                            registrationNumber: document.getElementById('regNumber').value,
                            mobileNumber: document.getElementById('regMobile').value
                        };

                        await api.events.registerEvent(eventId, data);

                        alertBox.className = 'alert alert-success d-block';
                        alertBox.innerText = 'Registration successful!';
                        
                        setTimeout(() => {
                            const modalEl = document.getElementById('eventRegistrationModal');
                            const modal = bootstrap.Modal.getInstance(modalEl);
                            modal.hide();
                            loadEventData(eventId); // Refresh details
                        }, 1500);

                    } catch (error) {
                        alertBox.className = 'alert alert-danger d-block';
                        alertBox.innerText = error.message;
                    } finally {
                        btn.disabled = false;
                        btn.innerHTML = 'Confirm Registration';
                    }
                });
            }
        });

        async function loadEventData(id) {
            try {
                const eventData = await api.events.getOne(id);
                
                document.getElementById('eventTitle').innerText = eventData.title;
                document.getElementById('eventCategory').innerText = eventData.category;
                document.getElementById('eventDate').innerText = new Date(eventData.date).toLocaleDateString();
                document.getElementById('eventTime').innerText = eventData.time;
                document.getElementById('eventVenue').innerText = eventData.venue || 'Online via link';
                document.getElementById('eventDescription').innerText = eventData.description;
                document.getElementById('eventSpeaker').innerText = eventData.speaker || 'No Speaker Specified';
                
                // Remove old job badges if any (to prevent duplicates on multi-refresh)
                const existingBadge = document.querySelector('.linked-job-badge');
                if (existingBadge) existingBadge.remove();

                if (eventData.linkedJob) {
                    const linkedJobBadge = document.createElement('a');
                    linkedJobBadge.href = `job-details.html?id=${eventData.linkedJob._id}`;
                    linkedJobBadge.className = "badge bg-warning bg-opacity-25 text-dark border border-warning text-decoration-none d-flex align-items-center me-2 linked-job-badge";
                    linkedJobBadge.innerHTML = `<i class="bi bi-briefcase-fill text-warning me-2"></i> Linked Job: ${eventData.linkedJob.title} at ${eventData.linkedJob.company}`;
                    document.getElementById('eventCategory').parentElement.prepend(linkedJobBadge);
                }
                
                if (eventData.bannerImage) {
                    document.getElementById('eventBanner').src = `http://localhost:5000${eventData.bannerImage}`;
                }

                document.getElementById('attendeeCount').innerText = eventData.registeredUsers.length;
                if(eventData.registeredUsers.length > 0) {
                    document.getElementById('attendeesList').innerHTML = eventData.registeredUsers.map(u => {
                        const img = u.profileImage ? `http://localhost:5000${u.profileImage}` : `https://ui-avatars.com/api/?name=${u.name}&background=random`;
                        return `<img src="${img}" title="${u.name}" class="rounded-circle border border-white" width="40" height="40" style="margin-right: -10px; z-index: 1; position: relative;">`;
                    }).join('');
                } else {
                    document.getElementById('attendeesList').innerHTML = '';
                }

                // Handle Register button state
                if (currentUser) {
                    const isRegistered = eventData.registeredUsers.some(u => u._id === currentUser.id);
                    if (isRegistered) {
                        const btn = document.getElementById('registerBtn');
                        btn.innerText = 'Registered';
                        btn.classList.add('btn-success');
                        btn.classList.remove('btn-primary');
                        btn.disabled = true;
                    }
                }

            } catch (error) {
                console.error(error);
                if (!document.getElementById('eventTitle').innerText || document.getElementById('eventTitle').innerText === 'Loading...') {
                    document.body.innerHTML = `<div class="container mt-5 pt-5 text-center"><h3>Event Not Found or Unauthorized</h3></div>`;
                }
            }
        }
    </script>
    <!-- Event Registration Modal -->
    <div class="modal fade" id="eventRegistrationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 25px; overflow: hidden; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);">
                <div class="modal-header border-0 bg-primary bg-opacity-10 py-4">
                    <h5 class="modal-title fw-bold text-primary" id="regModalTitle">Register for Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="eventRegistrationForm">
                        <input type="hidden" id="regEventId">
                        <div class="mb-4">
                            <label class="form-label fw-semibold small opacity-75">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-person text-primary"></i></span>
                                <input type="text" id="regFullName" class="form-control bg-light border-0 py-2" placeholder="Enter your full name" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small opacity-75">Registration / Roll Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-card-text text-primary"></i></span>
                                <input type="text" id="regNumber" class="form-control bg-light border-0 py-2" placeholder="Enter registration number" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small opacity-75">Mobile Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-phone text-primary"></i></span>
                                <input type="tel" id="regMobile" class="form-control bg-light border-0 py-2" placeholder="Enter mobile number" required>
                            </div>
                        </div>
                        <div id="regAlert" class="alert d-none mb-3 py-2 small"></div>
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm" id="regSubmitBtn">
                            Confirm Registration
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
