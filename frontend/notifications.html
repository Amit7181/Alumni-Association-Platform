<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - AlumniConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill"></i> AlumniConnect</a>
            <div class="ms-auto"><a href="index.html" class="btn btn-outline-secondary">Go to Dashboard</a></div>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; margin-bottom: 60px;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0">Notifications</h3>
                    <button class="btn btn-sm btn-outline-primary" id="markAllReadBtn">Mark All as Read</button>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="list-group list-group-flush" id="notificationList">
                        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            api.checkAuth();
            
            if (window.socket) {
                window.socket.on('notification_received', () => fetchNotifications());
                window.socket.on('notifications_updated', () => fetchNotifications());
            }

            fetchNotifications();

            document.getElementById('markAllReadBtn').addEventListener('click', async () => {
                try {
                    const res = await fetch(`${BASE_URL}/notifications/read-all`, { method: 'PUT', headers: api.getHeaders() });
                    await api.handleResponse(res);
                    fetchNotifications();
                } catch(e) { alert(e.message); }
            });
        });

        async function fetchNotifications() {
            const container = document.getElementById('notificationList');
            try {
                const res = await fetch(`${BASE_URL}/notifications`, { headers: api.getHeaders() });
                const notifications = await api.handleResponse(res);

                if(notifications.length === 0) {
                    container.innerHTML = `<div class="p-5 text-center text-muted"><i class="bi bi-bell-slash fs-1 d-block mb-3"></i>No notifications.</div>`;
                    return;
                }

                let html = '';
                notifications.forEach(n => {
                    const iconMap = {
                        job: 'bi-briefcase text-primary',
                        event: 'bi-calendar-event text-warning',
                        announcement: 'bi-megaphone text-danger',
                        mentorship: 'bi-person-up text-success',
                        system: 'bi-info-circle text-secondary'
                    };
                    const icon = iconMap[n.type] || iconMap.system;
                    const unreadClass = n.isRead ? '' : 'bg-primary bg-opacity-10 fw-bold';
                    
                    const clickHandler = n.link ? `markAsRead('${n._id}', ${n.isRead}, '${n.link}')` : `markAsRead('${n._id}', ${n.isRead})`;
                    
                    html += `
                    <div class="list-group-item list-group-item-action p-4 ${unreadClass}" onclick="${clickHandler}">
                        <div class="d-flex align-items-start">
                            <div class="bg-white border rounded-circle p-2 d-flex align-items-center justify-content-center shadow-sm me-3" style="width: 45px; height: 45px;">
                                <i class="bi ${icon} fs-5"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <h6 class="mb-0 ${!n.isRead ? 'fw-bold' : ''}">${n.title}</h6>
                                    <small class="text-muted" style="white-space: nowrap;">${new Date(n.createdAt).toLocaleDateString()}</small>
                                </div>
                                <p class="mb-0 text-muted small">${n.message}</p>
                            </div>
                            ${!n.isRead ? '<span class="badge bg-primary ms-3 mt-1 rounded-circle" style="padding: 5px;">&nbsp;</span>' : ''}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = `<div class="p-4 text-danger text-center">Failed to load notifications.</div>`;
            }
        }

        window.markAsRead = async function(id, isRead, link) {
            if(!isRead) {
                try {
                    const res = await fetch(`${BASE_URL}/notifications/${id}/read`, { method: 'PUT', headers: api.getHeaders() });
                    await api.handleResponse(res);
                } catch(e) {}
            }
            if(link) {
                window.open(link, '_blank');
            }
            fetchNotifications();
        }
    </script>
</body>
</html>
