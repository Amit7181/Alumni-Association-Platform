<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AlumniConnect</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body>
    <!-- Background Decoration Blobs -->
    <div class="bg-blob" id="blob-1"></div>
    <div class="bg-blob" id="blob-2"></div>
    <div class="bg-blob" id="blob-3"></div>

    <div class="app-container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-mortarboard-fill"></i> AlumniConnect
                </a>
                <div class="ms-auto">
                    <a href="login.html" class="btn btn-outline-primary">Log In</a>
                </div>
            </div>
        </nav>

        <div class="card auth-card mx-auto shadow-lg border-0 overflow-hidden" style="max-width: 900px;">
            <div class="p-4 p-md-5">
                <div class="text-center mb-5">
                    <h2 class="display-5 fw-bold text-primary mb-2">Create Account</h2>
                    <p class="opacity-75">Join the network to unlock exclusive mentorship & career opportunities.</p>
                </div>
                
                <div class="d-flex justify-content-center mb-5">
                    <div class="nav-pills d-flex gap-0">
                        <button type="button" class="nav-link active role-tab-btn" data-role="student">Student</button>
                        <button type="button" class="nav-link role-tab-btn" data-role="alumni">Alumni</button>
                        <button type="button" class="nav-link role-tab-btn" data-role="admin">Admin</button>
                    </div>
                </div>

                <form id="registerForm">
                    <input type="hidden" id="selectedRole" value="student">
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                        </div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Phone Number (Optional)</label>
                            <input type="text" class="form-control" id="phone" placeholder="+91 0000000000">
                        </div>
                        <div class="col-md-6" id="departmentWrapper">
                            <label class="form-label small fw-semibold">Department</label>
                            <select class="form-select" id="department" required>
                                <option value="" selected disabled>Select Department</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Electrical Engineering">Electrical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-6" id="passingYearWrapper">
                            <label class="form-label small fw-semibold">Passing / Expected Year</label>
                            <input type="number" class="form-control" id="passingYear" placeholder="2024" required>
                        </div>
                        <div class="col-md-6" id="studentFields">
                            <label class="form-label small fw-semibold">Roll / Enrollment Number</label>
                            <input type="text" class="form-control" id="rollNumber" placeholder="CS2020001">
                        </div>
                    </div>

                    <!-- Alumni Specific Fields -->
                    <div id="alumniFields" class="d-none card p-4 mb-4 border-primary border-opacity-25">
                        <h6 class="fw-bold mb-4 text-primary"><i class="bi bi-briefcase me-2"></i> Professional Details</h6>
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Current Company</label>
                                <input type="text" class="form-control" id="currentCompany" placeholder="Google / Microsoft">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Current Designation</label>
                                <input type="text" class="form-control" id="jobRole" placeholder="Software Engineer">
                            </div>
                        </div>
                        <div class="mb-0">
                            <label class="form-label small fw-semibold">Skills</label>
                            <input type="text" class="form-control" id="skills" placeholder="React, Node.js, AWS">
                        </div>
                    </div>

                    <!-- Admin Specific Fields -->
                    <div id="adminFields" class="d-none card p-4 mb-4 border-danger border-opacity-25 bg-danger bg-opacity-10">
                        <h6 class="fw-bold mb-3 text-danger"><i class="bi bi-shield-lock me-2"></i> Admin Verification</h6>
                        <div class="mb-0">
                            <label class="form-label small fw-semibold text-danger">Admin Passcode</label>
                            <input type="password" class="form-control border-danger border-opacity-50" id="adminPasscode" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="row g-4 mb-5">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-check mb-5">
                        <input class="form-check-input" type="checkbox" id="termsBox" required>
                        <label class="form-check-label opacity-75 small" for="termsBox">
                            I agree to the <a href="#" class="text-primary text-decoration-none fw-bold">Terms</a> and <a href="#" class="text-primary text-decoration-none fw-bold">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" id="registerBtn" class="btn btn-primary w-100 mb-4">Register Account</button>
                    
                    <p class="text-center opacity-75 mb-0">
                        Already have an account? <a href="login.html" class="fw-bold text-primary text-decoration-none">Log In</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');
            const verified = params.get('verified');
            
            if (email) {
                const emailInput = document.getElementById('email');
                emailInput.value = email;
                if (verified === 'true') {
                    emailInput.readOnly = true;
                    const badge = document.createElement('span');
                    badge.className = 'badge-custom bg-success text-white position-absolute end-0 top-0 mt-4 me-4';
                    badge.innerHTML = '<i class="bi bi-patch-check-fill me-1"></i> Verified';
                    emailInput.parentElement.appendChild(badge);
                    emailInput.parentElement.classList.add('position-relative');
                }
            }
        });
    </script>
</body>
</html>
